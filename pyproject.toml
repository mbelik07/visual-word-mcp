[project]
name = "visual-word-mcp"
version = "0.1.0"
description = "MCP server that composes full-page A4 portrait images and compiles them into Microsoft Word (.docx) and PDF documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
]

[project.scripts]
visual-word-mcp = "visual_word_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
