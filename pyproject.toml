[project]
name = "visual-word-mcp"
version = "1.0.0"
description = "Composes full-page A4 portrait page images and compiles them into Microsoft Word (.docx) and PDF documents, with an interactive editing workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0",
  "python-docx>=1.1.2",
  "pillow>=10.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "openai>=1.40.0"
]

[project.scripts]
visual-word-mcp = "visual_word_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_word_mcp"]
